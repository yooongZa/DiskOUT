name: EjectDrives
options:
  bundleIdPrefix: com.yongza
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 495S4FVMCB
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.yongza.ejectdrives
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  EjectDrives:
    type: application
    platform: macOS
    sources:
      - path: AppDelegate.swift
      - path: main.swift
      - path: DiskArbitrationBackend.swift
      - path: Localizable.xcstrings
    entitlements:
      path: EjectDrives.entitlements
      properties:
        # Mac App Store 필수
        com.apple.security.app-sandbox: true
        # 사용자가 메뉴에서 외장 드라이브 클릭 = 사용자 선택 파일/폴더 접근
        com.apple.security.files.user-selected.read-write: true
        # USB 장치 접근 — 외장 USB 디스크 unmount/mount 에 필요
        com.apple.security.device.usb: true
        # /Volumes/ 절대 경로 접근 — 외장 디스크 mount path 가 모두 /Volumes/ 아래.
        # App Store 심사 정당화: 외장 드라이브 추출/마운트가 본 앱의 본질 기능.
        com.apple.security.temporary-exception.files.absolute-path.read-write:
          - /Volumes/
    info:
      path: Info.plist
      properties:
        CFBundleName: EjectDrives
        CFBundleDisplayName: EjectDrives
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "EjectDrives by yongZa"
        CFBundleLocalizations:
          - en
          - ko
        CFBundleDevelopmentRegion: en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yongza.ejectdrives
        DEVELOPMENT_TEAM: 495S4FVMCB
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
