name: DiskOUT
options:
  bundleIdPrefix: com.yongza
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 495S4FVMCB
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DiskOUT:
    type: application
    platform: macOS
    sources:
      - path: AppDelegate.swift
      - path: main.swift
      - path: Localizable.xcstrings
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleName: DiskOUT
        CFBundleDisplayName: DiskOUT
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "DiskOUT by yongZa"
        CFBundleLocalizations:
          - en
          - ko
        CFBundleDevelopmentRegion: en
    settings:
      base:
        # Bundle ID 는 사용자 데이터(UserDefaults·LoginItem·키체인) 호환성 위해 유지
        PRODUCT_BUNDLE_IDENTIFIER: com.yongza.ejectdrives
        DEVELOPMENT_TEAM: 495S4FVMCB
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
    entitlements:
      # sandbox 노선 폐기 — 빈 entitlements 로 명시.
      # 향후 누군가 Helper / DA backend 다시 빌드할 때 entitlements 가 자동 생성되어
      # sandbox=true 가 들어가는 함정을 방지한다 (xcodegen 의 entitlements 자동 생성 동작).
      path: DiskOUT.entitlements
      properties: {}
