name: DiskOUT
options:
  bundleIdPrefix: com.yongza
  deploymentTarget:
    macOS: "13.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 495S4FVMCB
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.5.11"
    CURRENT_PROJECT_VERSION: "25"

# Swift Package Manager 의존성.
# Sparkle 2: 자동 업데이트 프레임워크 (https://sparkle-project.org).
# from: 2.9.6 — 2.x 안에서 자동 마이너 업그레이드 허용. 메이저 (3.x) 는 막힘.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"

targets:
  DiskOUT:
    type: application
    platform: macOS
    sources:
      - path: AppDelegate.swift
      - path: CrashReportParsing.swift
      - path: AppLifecycleTelemetry.swift
      - path: DiskActivityPolicy.swift
      - path: DiskClassification.swift
      - path: EjectAndSleepPolicy.swift
      - path: LanguageRuntime.swift
      - path: PaddleBilling.swift
      - path: PowerSleepAckCoordinator.swift
      - path: PremiumAccessPolicy.swift
      - path: SleepEpisodeCoordinator.swift
      - path: SleepUnmountPolicy.swift
      - path: SettingsBehaviorPolicy.swift
      - path: StatusCharacterAnimator.swift
      - path: StatusItemPresentation.swift
      - path: main.swift
      - path: Localizable.xcstrings
      - path: Assets.xcassets
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleName: DiskOUT
        CFBundleDisplayName: DiskOUT
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "DiskOUT by LIMOD"
        CFBundleLocalizations:
          - en
          - ja
          - ko
          - zh-Hans
        CFBundleDevelopmentRegion: en
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.yongza.ejectdrives.premium-refresh
            CFBundleURLSchemes:
              - diskout
        # Sparkle 자동 업데이트 설정.
        # SUFeedURL: appcast.xml 피드 URL. Cloudflare Worker(scripts/appcast-proxy/)가
        #            익명 업데이트 체크를 집계한 뒤 GitHub Pages 의 서명 appcast 를 그대로
        #            프록시한다 (서명 무결성 유지). 운영 상세: DiskOUT_텔레메트리.md.
        # SUPublicEDKey: EdDSA 공개키 — scripts/setup-sparkle-keys.sh 실행 후 출력값을 여기 채움.
        #                비어 있으면 Sparkle 은 Apple Code Signing 만으로 검증 (보안 한 단계 약함).
        # SUEnableAutomaticChecks: 첫 실행 후 동의 다이얼로그 1회 표시, 그 뒤 백그라운드 체크.
        # SUScheduledCheckInterval: 86400s = 24h. 매일 1회 조용히 체크.
        SUFeedURL: https://diskout-appcast.sukmack.workers.dev/appcast.xml
        SUPublicEDKey: "ObQo/BNVRTo8chYqk127BR2sOIE7NNQaYGQEEuGdIFE="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Paddle public configuration only. API keys, webhook secrets, and the Ed25519
        # private signing key belong exclusively in the billing Worker secrets.
        # Missing or invalid values deliberately hide purchase UI and keep the free presentation.
        DiskOUTBillingBaseURL: "https://diskout-paddle-billing.sukmack.workers.dev"
        DiskOUTPaddleOneTimePriceID: "pri_01kxz609bdn1m025acsb60b366"
        DiskOUTEntitlementPublicKey: "ptsyyuHUpc6JBSSw3E/EQ6HEh5aF+u86HnwcFmdjnik="
    settings:
      base:
        # Bundle ID 는 사용자 데이터(UserDefaults·LoginItem·키체인) 호환성 위해 유지
        PRODUCT_BUNDLE_IDENTIFIER: com.yongza.ejectdrives
        DEVELOPMENT_TEAM: 495S4FVMCB
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
    entitlements:
      # sandbox 노선 폐기 — 빈 entitlements 로 명시.
      # 향후 누군가 Helper / DA backend 다시 빌드할 때 entitlements 가 자동 생성되어
      # sandbox=true 가 들어가는 함정을 방지한다 (xcodegen 의 entitlements 자동 생성 동작).
      path: DiskOUT.entitlements
      properties: {}
